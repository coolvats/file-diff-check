version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - APPROVAL_EMAIL=${APPROVAL_EMAIL}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - file-check-network

networks:
  file-check-network:
    driver: bridge

volumes:
  uploads:
