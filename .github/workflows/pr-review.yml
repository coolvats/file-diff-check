name: PR Code Review and Approval

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          bandit -r app/ -f json -o bandit-report.json || true

      - name: Check for vulnerabilities with Safety
        continue-on-error: true
        run: |
          safety check --json > safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dependencies with pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --format json > pip-audit-report.json || true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: pip-audit-report.json

  langsmith-review:
    name: LangSmith Code Review
    runs-on: ubuntu-latest
    needs: [security-scan, dependency-scan]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install langsmith langchain PyGithub

      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports

      - name: Download dependency reports
        uses: actions/download-artifact@v4
        with:
          name: dependency-reports

      # ✅ Fleet Agent Integration
      - name: Fetch PR commit history via LangSmith Fleet
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/run_fleet_pr_commit_agent.py \
            --repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }} \
            --output pr-commit-summary.json

      - name: Upload PR commit summary
        uses: actions/upload-artifact@v4
        with:
          name: pr-commit-summary
          path: pr-commit-summary.json

      - name: Run LangSmith code review
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/run_code_review.py \
            --repo ${{ github.repository }} \
            --pr-number ${{ github.event.pull_request.number }} \
            --commit-sha ${{ github.event.pull_request.head.sha }} \
            --branch-name ${{ github.event.pull_request.head.ref }} \
            --security-report bandit-report.json \
            --dependency-report pip-audit-report.json \
            --pr-commit-summary pr-commit-summary.json

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: code-review-report
          path: review-result.json

  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  approval-request:
    name: Request Approval
    runs-on: ubuntu-latest
    needs: [langsmith-review, tests]
    if: always()

    steps:
      - uses: actions/checkout@v3

      - name: Download code review report
        uses: actions/download-artifact@v3
        with:
          name: code-review-report
          continue-on-error: true

      - name: Download PR commit summary
        uses: actions/download-artifact@v3
        with:
          name: pr-commit-summary
          continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

