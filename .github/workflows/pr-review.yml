name: PR Code Review and Approval

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety
      
      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
      
      - name: Check for vulnerabilities with Safety
        continue-on-error: true
        run: |
          safety check --json > safety-report.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check dependencies with pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --format json > pip-audit-report.json || true
      
      - name: Upload dependency report
        uses: actions/upload-artifact@v3
        with:
          name: dependency-reports
          path: pip-audit-report.json

  langsmith-review:
    name: LangSmith Code Review
    runs-on: ubuntu-latest
    needs: [security-scan, dependency-scan]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install langsmith langchain
      
      - name: Download security reports
        uses: actions/download-artifact@v3
        with:
          name: security-reports
      
      - name: Download dependency reports
        uses: actions/download-artifact@v3
        with:
          name: dependency-reports
      
      - name: Run LangSmith code review
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/run_code_review.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --commit-sha ${{ github.event.pull_request.head.sha }} \
            --branch-name ${{ github.event.pull_request.head.ref }} \
            --security-report bandit-report.json \
            --dependency-report pip-audit-report.json
      
      - name: Check review results
        id: review
        run: |
          if [ -f review-result.json ]; then
            STATUS=$(jq -r '.status' review-result.json)
            APPROVAL_REQUIRED=$(jq -r '.approval_required' review-result.json)
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "approval_required=$APPROVAL_REQUIRED" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload review report
        uses: actions/upload-artifact@v3
        with:
          name: code-review-report
          path: review-result.json

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run pytest
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  approval-request:
    name: Request Approval
    runs-on: ubuntu-latest
    needs: [langsmith-review, tests]
    if: always()
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Download code review report
        uses: actions/download-artifact@v3
        with:
          name: code-review-report
          continue-on-error: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Send approval request email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          APPROVAL_EMAIL: ${{ secrets.APPROVAL_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/send_approval_email.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --commit-sha ${{ github.event.pull_request.head.sha }} \
            --review-file review-result.json
      
      - name: Comment on PR with status
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Code Review Summary\n\n';
            
            if (fs.existsSync('review-result.json')) {
              const review = JSON.parse(fs.readFileSync('review-result.json', 'utf8'));
              comment += `**Status**: ${review.status}\n\n`;
              comment += `**Security Issues**: ${review.security_issues.length}\n`;
              comment += `**Dependency Issues**: ${review.dependency_issues.length}\n\n`;
              
              if (review.recommendations.length > 0) {
                comment += '### Recommendations\n';
                review.recommendations.forEach(rec => {
                  comment += `- ${rec}\n`;
                });
              }
            }
            
            comment += '\n**Action**: Approval required for deployment. Check email for approval link.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
