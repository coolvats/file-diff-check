                python scripts/trigger_fleet_approval_agent.py \
                --review-file review-result.json \
                --pr-number ${{ github.event.pull_request.number }}

                                       --review-file review-result.json

      - name: Comment on PR with status
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Code Review Summary\n\n';

            if (fs.existsSync('review-result.json')) {
              const review = JSON.parse(fs.readFileSync('review-result.json', 'utf8'));
              comment += `**Status**: ${review.status}\n\n`;
              comment += `**Commits Reviewed**: ${review.commit_count || 'N/A'}\n`;
              comment += `**Security Issues**: ${review.security_issues.length}\n`;
              comment += `**Dependency Issues**: ${review.dependency_issues.length}\n\n`;

              if (review.risk_flags && review.risk_flags.length > 0) {
                comment += '### ⚠️ Risk Flags\n';
                review.risk_flags.forEach(risk => {
                  comment += `- ${risk}\n`;
                });
              }
            }

            comment += '\n**Action**: Approval required for deployment.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });


